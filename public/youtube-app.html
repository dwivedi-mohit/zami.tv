<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YouTube</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yt-white: #ffffff;
      --yt-bg: #ffffff;
      --yt-text-primary: #0f0f0f;
      --yt-text-secondary: #606060;
      --yt-text-muted: #8e8e8e;
      --yt-pill-bg: #f2f2f2;
      --yt-pill-hover: #e5e5e5;
      --yt-cyan: #00bcd4;
      --yt-cyan-hover: #00acc1;
      --yt-red: #ff0000;
      --yt-border: #f0f0f0;
    }

    html, body {
      background: var(--yt-bg);
      color: var(--yt-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       TOP MODAL HEADER (< ×  YouTube  Paste link)
       ========================================================================== */
    .yt-modal-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      background: var(--yt-white);
      border-bottom: none;
      flex-shrink: 0;
      z-index: 50;
    }

    .yt-topbar-nav-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn-topbar-nav {
      background: transparent;
      border: none;
      color: var(--yt-text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
      transition: opacity 0.15s;
      touch-action: manipulation;
    }

    .btn-topbar-nav:active {
      opacity: 0.6;
    }

    .yt-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--yt-text-primary);
      letter-spacing: -0.01em;
    }

    .btn-paste-link {
      background: transparent;
      border: none;
      color: var(--yt-cyan);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 4px;
      transition: color 0.15s;
      touch-action: manipulation;
    }

    .btn-paste-link:hover {
      color: var(--yt-cyan-hover);
    }

    /* ==========================================================================
       SUB-HEADER (YouTube Logo + Search Magnifier Icon)
       ========================================================================== */
    .yt-sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 16px;
      background: var(--yt-white);
      flex-shrink: 0;
    }

    .yt-brand-logo-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    .yt-brand-logo-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #0f0f0f;
      line-height: 1;
    }

    .btn-search-icon {
      background: transparent;
      border: none;
      color: var(--yt-text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: background 0.15s;
      touch-action: manipulation;
    }

    .btn-search-icon:active {
      background: var(--yt-pill-bg);
    }

    /* ==========================================================================
       SCROLLABLE VIEWPORT
       ========================================================================== */
    .yt-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background: var(--yt-white);
      padding-bottom: 60px; /* spacing for bottom nav */
      -webkit-overflow-scrolling: touch;
    }

    /* ==========================================================================
       HOME GETTING STARTED STATE (Exact Match to User Screenshot)
       ========================================================================== */
    .yt-home-getting-started {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 32px 16px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Big Center Red Play Logo */
    .yt-center-logo-wrap {
      margin: 36px 0 28px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .yt-big-red-logo {
      width: 90px;
      height: 62px;
      filter: drop-shadow(0 6px 16px rgba(255, 0, 0, 0.28));
    }

    /* Search Row (Compass Pill, Search Input, Mic Pill) */
    .yt-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 28px;
    }

    .btn-round-action {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--yt-pill-bg);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--yt-text-primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      touch-action: manipulation;
    }

    .btn-round-action:active {
      background: var(--yt-pill-hover);
    }

    .yt-search-pill-form {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--yt-pill-bg);
      border-radius: 24px;
      height: 44px;
      padding: 0 16px;
      min-width: 0;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .yt-search-pill-form:focus-within {
      background: #ffffff;
      box-shadow: 0 0 0 1.5px var(--yt-text-primary);
    }

    .yt-search-pill-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--yt-text-primary);
      font-size: 15px;
      outline: none;
    }

    .yt-search-pill-input::placeholder {
      color: var(--yt-text-muted);
    }

    /* Center Card with subtle drop shadow */
    .yt-getting-started-card {
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.04);
      width: 100%;
      padding: 34px 22px;
      text-align: center;
    }

    .yt-started-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--yt-text-primary);
      margin-bottom: 12px;
      line-height: 1.22;
      letter-spacing: -0.02em;
    }

    .yt-started-desc {
      font-size: 14.5px;
      color: #555555;
      line-height: 1.42;
      max-width: 280px;
      margin: 0 auto;
    }

    /* ==========================================================================
       SEARCH RESULTS / VIDEO FEED
       ========================================================================== */
    .yt-feed-section {
      display: none;
      padding: 12px 16px 32px 16px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .yt-feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .yt-feed-query-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--yt-text-primary);
    }

    .btn-clear-feed {
      background: transparent;
      border: none;
      color: var(--yt-cyan);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .yt-video-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .yt-video-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--yt-border);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .yt-video-card:active {
      transform: scale(0.99);
    }

    .yt-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }

    .yt-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .yt-duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .yt-card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .btn-action-party {
      background: var(--yt-red);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 0, 0, 0.4);
      touch-action: manipulation;
    }

    .btn-action-queue {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .yt-card-info {
      padding: 12px 14px;
      display: flex;
      gap: 10px;
    }

    .yt-avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .yt-card-text {
      flex: 1;
      min-width: 0;
    }

    .yt-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--yt-text-primary);
      line-height: 19px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .yt-card-meta {
      font-size: 12px;
      color: var(--yt-text-secondary);
      line-height: 16px;
    }

    /* ==========================================================================
       DEDICATED SHORTS VIEW
       ========================================================================== */
    .yt-shorts-section {
      display: none;
      padding: 12px 16px 32px 16px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .yt-shorts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .yt-short-card {
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #181818;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
    }

    .yt-short-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .yt-short-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 45%, transparent 70%);
      z-index: 2;
    }

    .yt-short-meta {
      position: relative;
      z-index: 3;
    }

    .yt-short-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 17px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .yt-short-views {
      font-size: 11px;
      color: #e0e0e0;
      margin-top: 3px;
    }

    /* ==========================================================================
       DEDICATED YOU / LIBRARY VIEW
       ========================================================================== */
    .yt-you-section {
      display: none;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .yt-you-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--yt-border);
      margin-bottom: 20px;
    }

    .yt-you-avatar-large {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }

    .yt-you-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--yt-text-primary);
    }

    .yt-you-subtitle {
      font-size: 13px;
      color: var(--yt-text-secondary);
    }

    .yt-section-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--yt-text-primary);
      margin-bottom: 12px;
    }

    /* ==========================================================================
       PREVIEW WATCH VIEW
       ========================================================================== */
    .yt-watch-section {
      display: none;
      padding: 12px 16px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .yt-watch-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .yt-watch-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .yt-watch-info-bar {
      margin-top: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--yt-border);
    }

    .yt-watch-video-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--yt-text-primary);
      line-height: 22px;
    }

    .yt-watch-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-screen-party {
      background: var(--yt-red);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .btn-queue-party {
      background: var(--yt-pill-bg);
      color: var(--yt-text-primary);
      border: 1px solid var(--yt-border);
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .btn-watch-secondary {
      background: var(--yt-pill-bg);
      color: var(--yt-text-primary);
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .btn-watch-secondary.active {
      background: rgba(0, 188, 212, 0.15);
      color: var(--yt-cyan);
    }

    /* ==========================================================================
       BOTTOM NAVIGATION BAR (Exact Match to User Screenshot: Home, Shorts, You)
       ========================================================================== */
    .yt-rave-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--yt-white);
      border-top: 1px solid var(--yt-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .yt-bottom-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: transparent;
      border: none;
      color: var(--yt-text-secondary);
      font-size: 11px;
      cursor: pointer;
      flex: 1;
      padding: 4px 0;
      touch-action: manipulation;
    }

    .yt-bottom-tab.active {
      color: var(--yt-text-primary);
      font-weight: 700;
    }

    .yt-bottom-tab svg {
      width: 22px;
      height: 22px;
    }

    /* ==========================================================================
       PASTE LINK DIALOG / MODAL
       ========================================================================== */
    dialog.yt-paste-modal {
      border: none;
      border-radius: 20px;
      background: #ffffff;
      padding: 24px;
      max-width: 440px;
      width: 90%;
      margin: auto;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    dialog.yt-paste-modal::backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .yt-paste-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .yt-paste-header h3 {
      font-size: 18px;
      font-weight: 700;
      color: #0f0f0f;
    }

    .btn-close-paste {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #606060;
      line-height: 1;
    }

    .yt-paste-input {
      width: 100%;
      height: 46px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      color: #0f0f0f;
      outline: none;
      margin-bottom: 16px;
    }

    .yt-paste-input:focus {
      border-color: var(--yt-cyan);
    }

    .yt-paste-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-paste-action {
      border-radius: 18px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }

    .btn-paste-action.primary {
      background: var(--yt-red);
      color: #fff;
    }

    .btn-paste-action.secondary {
      background: var(--yt-pill-bg);
      color: #0f0f0f;
    }

    /* TOAST */
    .yt-toast {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f0f0f;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .yt-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- TOP BAR (< ×  YouTube  Paste link) -->
  <header class="yt-modal-topbar">
    <div class="yt-topbar-nav-group">
      <button type="button" class="btn-topbar-nav" id="btn-topbar-back" aria-label="Go Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button type="button" class="btn-topbar-nav" id="btn-topbar-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <span class="yt-modal-title">YouTube</span>
    </div>

    <button type="button" class="btn-paste-link" id="btn-open-paste">Paste link</button>
  </header>

  <!-- SUB-HEADER (YouTube Brand Logo + Search Magnifier Icon) -->
  <div class="yt-sub-header">
    <button type="button" class="yt-brand-logo-btn" id="btn-brand-home" aria-label="YouTube Home">
      <svg class="yt-brand-play-icon" viewBox="0 0 30 21" width="30" height="21" fill="none">
        <rect width="30" height="21" rx="5" fill="#FF0000"/>
        <polygon points="12,5.5 20,10.5 12,15.5" fill="#FFFFFF"/>
      </svg>
      <span class="yt-brand-logo-text">YouTube</span>
    </button>

    <button type="button" class="btn-search-icon" id="btn-header-search" aria-label="Search">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7.5"></circle>
        <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
    </button>
  </div>

  <!-- MAIN VIEWPORT -->
  <main class="yt-viewport" id="yt-viewport">

    <!-- VIEW 1: HOME GETTING STARTED (Exact Match to User Screenshot) -->
    <div class="yt-home-getting-started" id="yt-view-home">
      <!-- Big Center Red Logo -->
      <div class="yt-center-logo-wrap">
        <svg class="yt-big-red-logo" viewBox="0 0 90 62" fill="none">
          <rect width="90" height="62" rx="19" fill="#FF0000"/>
          <polygon points="36,19 60,31 36,43" fill="#FFFFFF"/>
        </svg>
      </div>

      <!-- Search Row: [🧭 Compass] [Search YouTube Input] [🎙️ Mic] -->
      <div class="yt-search-row">
        <button type="button" class="btn-round-action" id="btn-explore-compass" title="Explore Trending" aria-label="Explore Trending">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"></circle>
            <polygon points="14.8,9.2 13.2,13.8 9.2,14.8 10.8,10.2" fill="currentColor"></polygon>
          </svg>
        </button>

        <form class="yt-search-pill-form" id="yt-search-form" role="search">
          <input type="text" class="yt-search-pill-input" id="yt-search-input" placeholder="Search YouTube" autocomplete="off" aria-label="Search YouTube">
        </form>

        <button type="button" class="btn-round-action" id="btn-voice-mic" title="Voice Search" aria-label="Voice Search">

            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>ADD TO QUEUE</span>
          </button>

          <button type="button" class="btn-watch-secondary" id="btn-watch-like" title="Like">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path>

        <circle cx="12" cy="8.5" r="3.2"></circle>

  <!-- PASTE LINK DIALOG -->
  <dialog id="yt-paste-dialog" class="yt-paste-modal" aria-labelledby="paste-dialog-title">
    <div class="yt-paste-header">
      <h3 id="paste-dialog-title">Paste YouTube Link</h3>
      <button type="button" class="btn-close-paste" id="btn-close-paste" aria-label="Close">&times;</button>
    </div>
    <div>
      <input type="url" id="yt-paste-input" class="yt-paste-input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <div class="yt-paste-actions">
        <button type="button" class="btn-paste-action secondary" id="btn-paste-queue">Add to Queue</button>
        <button type="button" class="btn-paste-action primary" id="btn-paste-play">Screen to Party</button>
      </div>
    </div>
  </dialog>

  <!-- TOAST -->
  <div class="yt-toast" id="yt-toast" role="status" aria-live="polite"></div>

  <script>
    (function() {
      // Views
      const views = {
        home: document.getElementById('yt-view-home'),
        feed: document.getElementById('yt-view-feed'),
        shorts: document.getElementById('yt-view-shorts'),
        you: document.getElementById('yt-view-you'),
        watch: document.getElementById('yt-view-watch')
      };

      // Navigation Buttons
      const tabHome = document.getElementById('tab-home');
      const tabShorts = document.getElementById('tab-shorts');
      const tabYou = document.getElementById('tab-you');
      const allTabs = [tabHome, tabShorts, tabYou];

      const btnTopbarBack = document.getElementById('btn-topbar-back');
      const btnTopbarClose = document.getElementById('btn-topbar-close');
      const btnBrandHome = document.getElementById('btn-brand-home');
      const btnHeaderSearch = document.getElementById('btn-header-search');
      const btnClearFeed = document.getElementById('btn-clear-feed');

      // Search
      const searchForm = document.getElementById('yt-search-form');
      const searchInput = document.getElementById('yt-search-input');
      const btnExploreCompass = document.getElementById('btn-explore-compass');
      const btnVoiceMic = document.getElementById('btn-voice-mic');
      const feedQueryLabel = document.getElementById('yt-feed-query-label');
      const videoList = document.getElementById('yt-video-list');
      const shortsGrid = document.getElementById('yt-shorts-grid');
      const likedList = document.getElementById('yt-liked-list');

      // Watch view
      const activePlayer = document.getElementById('active-yt-player');
      const watchTitle = document.getElementById('yt-watch-title');
      const btnScreenParty = document.getElementById('btn-screen-party');
      const btnQueueParty = document.getElementById('btn-queue-party');
      const btnWatchLike = document.getElementById('btn-watch-like');
      const btnWatchShare = document.getElementById('btn-watch-share');
      const watchRelated = document.getElementById('yt-watch-related');

      // Paste Link Dialog
      const btnOpenPaste = document.getElementById('btn-open-paste');
      const pasteDialog = document.getElementById('yt-paste-dialog');
      const btnClosePaste = document.getElementById('btn-close-paste');
      const pasteInput = document.getElementById('yt-paste-input');
      const btnPastePlay = document.getElementById('btn-paste-play');
      const btnPasteQueue = document.getElementById('btn-paste-queue');

      const toast = document.getElementById('yt-toast');
      const viewport = document.getElementById('yt-viewport');

      let currentActiveView = 'home';
      let currentVideo = null;
      let lastVideos = [];
      let likedVideos = [];

      // Toast Notification
      let toastTimer = null;
      function showToast(text) {
        if (!toast) return;
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = text;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function escapeHtml(t) {
        const d = document.createElement('div');
        d.textContent = t || '';
        return d.innerHTML;
      }

      // Switch View
      function switchView(viewName) {
        currentActiveView = viewName;

        if (viewName !== 'watch' && activePlayer) {
          activePlayer.src = 'about:blank';
        }

        Object.entries(views).forEach(([name, el]) => {
          if (el) el.style.display = (name === viewName) ? 'block' : 'none';
        });

        // Update tabs active state
        allTabs.forEach(t => {
          const isSelected = t.dataset.view === viewName;
          t.classList.toggle('active', isSelected);
          t.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        });

        if (viewName === 'shorts') renderShorts();
        if (viewName === 'you') renderYou();

        if (viewport) viewport.scrollTop = 0;
      }

      // Tab handlers
      tabHome.addEventListener('click', () => switchView('home'));
      tabShorts.addEventListener('click', () => switchView('shorts'));
      tabYou.addEventListener('click', () => switchView('you'));

      btnBrandHome.addEventListener('click', () => switchView('home'));
      btnClearFeed.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        switchView('home');
      });

      // Header search magnifier icon
      btnHeaderSearch.addEventListener('click', () => {
        switchView('home');
        if (searchInput) searchInput.focus();
      });

      // Voice Mic action
      btnVoiceMic.addEventListener('click', () => {
        showToast('Voice Search: Listening for speech...');
      });

      // Compass action: loads trending videos immediately!
      btnExploreCompass.addEventListener('click', () => {
        loadVideos('trending', 'Trending YouTube Videos');
      });

      // Search Form Submit
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = (searchInput?.value || '').trim();
        if (!q) return;

        const directId = extractVideoId(q);
        if (directId) {
          playVideo({
            id: directId,
            title: `YouTube Video [${directId}]`,
            channel: 'YouTube',
            thumbnail: `https://i.ytimg.com/vi/${directId}/hqdefault.jpg`,
            fullUrl: `https://www.youtube.com/watch?v=${directId}`
          });
        } else {
          loadVideos(q, `Results for "${q}"`);
        }
      });

      function extractVideoId(val) {
        if (!val) return null;
        if (/^[a-zA-Z0-9_-]{11}$/.test(val)) return val;
        const match = val.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([\w-]{11})/);
        return match ? match[1] : null;
      }

      // Fetch & Render Videos Feed
      async function loadVideos(query, displayLabel) {
        if (feedQueryLabel) feedQueryLabel.textContent = displayLabel;
        if (videoList) {
          videoList.innerHTML = `
            <div style="text-align: center; padding: 40px 0; color: #888;">
              <div style="display: inline-block; width: 28px; height: 28px; border: 3px solid #eee; border-top-color: #ff0000; border-radius: 50%; animation: ytSpin 0.7s linear infinite;"></div>
              <div style="margin-top: 10px; font-size: 13px;">Searching YouTube...</div>
            </div>
            <style>@keyframes ytSpin { 100% { transform: rotate(360deg); } }</style>
          `;
        }
        switchView('feed');

        try {
          const res = await fetch(`/api/youtube/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          lastVideos = data.results || [];
          if (lastVideos.length === 0) {
            lastVideos = [
              { id: 'Z7JlVX1CJtY', title: 'Chalre Chalre Waal : Shanzy Sial (Official Video) | Most Trending 2026', channel: 'Ragni Mp3', thumbnail: 'https://i.ytimg.com/vi/Z7JlVX1CJtY/hq720.jpg', duration: '4:01', views: '1.9M views', publishedTime: '12 days ago' },
              { id: 'RsEZmictANA', title: 'Taylor Swift - willow (Official Music Video)', channel: 'Taylor Swift', thumbnail: 'https://i.ytimg.com/vi/RsEZmictANA/hq720.jpg', duration: '4:13', views: '128M views', publishedTime: '3 years ago' },
              { id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito ft. Daddy Yankee', channel: 'Luis Fonsi', thumbnail: 'https://i.ytimg.com/vi/kJQP7kiw5Fk/hq720.jpg', duration: '4:42', views: '8.4B views', publishedTime: '7 years ago' },
              { id: 'fJ9rUzIMcZQ', title: 'Queen – Bohemian Rhapsody (Official Video Remastered)', channel: 'Queen Official', thumbnail: 'https://i.ytimg.com/vi/fJ9rUzIMcZQ/hq720.jpg', duration: '5:59', views: '1.7B views', publishedTime: '15 years ago' }
            ];
          }
          renderVideoList(lastVideos);
        } catch (e) {
          if (videoList) {
            videoList.innerHTML = `<div style="text-align: center; padding: 40px; color: #e11d48;">Could not load videos. Tap "Back to Search".</div>`;
          }
        }
      }

      function renderVideoList(videos) {
        if (!videoList) return;
        videoList.innerHTML = '';
        videos.forEach(v => videoList.appendChild(createVideoCard(v)));
      }

      function createVideoCard(v) {
        const card = document.createElement('div');
        card.className = 'yt-video-card';
        const thumb = v.thumbnail || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
        const initial = (v.channel || 'Y').charAt(0).toUpperCase();
        const meta = [v.channel, v.views, v.publishedTime].filter(Boolean).join(' • ');

        card.innerHTML = `
          <div class="yt-thumb-wrapper">
            <img class="yt-thumb-img" src="${thumb}" alt="${escapeHtml(v.title)}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
            ${v.duration ? `<div class="yt-duration-badge">${escapeHtml(v.duration)}</div>` : ''}
            <div class="yt-card-actions">
              <button type="button" class="btn-action-party" title="Screen to Watch Party Room">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span>Party</span>
              </button>
              <button type="button" class="btn-action-queue" title="Add to Room Queue">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>Queue</span>
              </button>
            </div>
          </div>
          <div class="yt-card-info">
            <div class="yt-avatar-circle">${initial}</div>
            <div class="yt-card-text">
              <div class="yt-card-title">${escapeHtml(v.title)}</div>
              <div class="yt-card-meta">${escapeHtml(meta)}</div>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-action-party')) {
            e.stopPropagation();
            screenToParty(v);
            return;
          }
          if (e.target.closest('.btn-action-queue')) {
            e.stopPropagation();
            queueForParty(v);
            return;
          }
          playVideo(v);
        });

        return card;
      }

      // Render Dedicated Shorts
      function renderShorts() {
        if (!shortsGrid) return;
        shortsGrid.innerHTML = '';
        const list = [
          { id: '3lSN4XdWpm4', title: 'Navratri outfit inspiration #trending #fashion #shorts', views: '8.3M views', thumbnail: 'https://i.ytimg.com/vi/3lSN4XdWpm4/frame0.jpg' },
          { id: '9WJqdSs5ZQM', title: 'Jethalal epic comedy moment! #shorts #comedy #viral', views: '14M views', thumbnail: 'https://i.ytimg.com/vi/9WJqdSs5ZQM/frame0.jpg' },
          { id: 'xz8htb5-8wM', title: 'Incredible Fitness & Energy motivation #shorts #viral', views: '69M views', thumbnail: 'https://i.ytimg.com/vi/xz8htb5-8wM/frame0.jpg' },
          { id: 'gCNeDWCI0vo', title: 'Street food cooking skills 1000% #shorts #food', views: '22M views', thumbnail: 'https://i.ytimg.com/vi/gCNeDWCI0vo/frame0.jpg' }
        ];

        list.forEach(s => {
          const card = document.createElement('div');
          card.className = 'yt-short-card';
          card.innerHTML = `
            <img class="yt-short-thumb" src="${s.thumbnail}" alt="${escapeHtml(s.title)}" loading="lazy">
            <div class="yt-short-gradient"></div>
            <div class="yt-short-meta">
              <div class="yt-short-title">${escapeHtml(s.title)}</div>
              <div class="yt-short-views">${escapeHtml(s.views)}</div>
            </div>
          `;
          card.addEventListener('click', () => {
            playVideo({
              id: s.id,
              title: s.title,
              channel: 'YouTube Shorts',
              thumbnail: s.thumbnail,
              fullUrl: `https://www.youtube.com/watch?v=${s.id}`
            });
          });
          shortsGrid.appendChild(card);
        });
      }

      // Render You / Liked
      function renderYou() {
        if (!likedList) return;
        likedList.innerHTML = '';
        if (likedVideos.length === 0) {
          likedList.innerHTML = `<div style="color: #888; font-size: 13px; padding: 12px 0;">No liked videos yet. Tap "Like" while previewing any video.</div>`;
        } else {
          likedVideos.forEach(v => likedList.appendChild(createVideoCard(v)));
        }
      }

      // Preview Video in Watch View
      function playVideo(video) {
        currentVideo = video;
        if (watchTitle) watchTitle.textContent = video.title;
        if (activePlayer) {
          activePlayer.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&enablejsapi=1`;
        }
        switchView('watch');

        if (watchRelated) {
          watchRelated.innerHTML = '';
          const related = lastVideos.filter(v => v.id !== video.id).slice(0, 4);
          related.forEach(v => watchRelated.appendChild(createVideoCard(v)));
        }
      }

      // VIDEO ACTIONS (PostMessage to Parent Room)
      function screenToParty(video) {
        const target = video || currentVideo;
        if (!target) return;
        const fullUrl = target.fullUrl || `https://www.youtube.com/watch?v=${target.id}`;

        window.parent.postMessage({
          type: 'CINESYNC_PLAY_YOUTUBE',
          url: fullUrl,
          title: target.title,
          videoId: target.id,
          poster: target.thumbnail
        }, '*');

        showToast(`Screening to Room Watch Party!`);
      }

      function queueForParty(video) {
        const target = video || currentVideo;
        if (!target) return;
        const fullUrl = target.fullUrl || `https://www.youtube.com/watch?v=${target.id}`;

        window.parent.postMessage({
          type: 'CINESYNC_QUEUE_YOUTUBE',
          url: fullUrl,
          title: target.title,
          videoId: target.id,
          poster: target.thumbnail
        }, '*');

        showToast(`Added to Party Queue!`);
      }

      btnScreenParty?.addEventListener('click', () => screenToParty(currentVideo));
      btnQueueParty?.addEventListener('click', () => queueForParty(currentVideo));

      btnWatchLike?.addEventListener('click', () => {
        if (!currentVideo) return;
        const idx = likedVideos.findIndex(v => v.id === currentVideo.id);
        if (idx > -1) {
          likedVideos.splice(idx, 1);
          btnWatchLike.classList.remove('active');
          showToast('Removed from Liked videos');
        } else {
          likedVideos.unshift(currentVideo);
          btnWatchLike.classList.add('active');
          showToast('Added to Liked videos');
        }
      });

      btnWatchShare?.addEventListener('click', async () => {
        const fullUrl = currentVideo?.fullUrl || window.location.href;
        if (navigator.share) {
          try {
            await navigator.share({ title: currentVideo?.title || 'YouTube', url: fullUrl });
            return;
          } catch(e) {}
        }
        try {
          await navigator.clipboard.writeText(fullUrl);
          showToast('Link copied to clipboard!');
        } catch(e) {
          showToast('Could not copy link');
        }
      });

      // Paste Link Dialog
      btnOpenPaste.addEventListener('click', () => {
        if (pasteInput) pasteInput.value = '';
        if (typeof pasteDialog.showModal === 'function') {
          pasteDialog.showModal();
        } else {
          pasteDialog.setAttribute('open', '');
        }
      });

      btnClosePaste.addEventListener('click', () => {
        if (typeof pasteDialog.close === 'function') {
          pasteDialog.close();
        } else {
          pasteDialog.removeAttribute('open');
        }
      });

      btnPastePlay.addEventListener('click', () => {
        const val = (pasteInput?.value || '').trim();
        if (!val) return;
        const id = extractVideoId(val) || val;
        screenToParty({
          id: id,
          title: `YouTube Video [${id}]`,
          fullUrl: val.startsWith('http') ? val : `https://www.youtube.com/watch?v=${id}`,
          thumbnail: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`
        });
        if (typeof pasteDialog.close === 'function') pasteDialog.close();
      });

      btnPasteQueue.addEventListener('click', () => {
        const val = (pasteInput?.value || '').trim();
        if (!val) return;
        const id = extractVideoId(val) || val;
        queueForParty({
          id: id,
          title: `YouTube Video [${id}]`,
          fullUrl: val.startsWith('http') ? val : `https://www.youtube.com/watch?v=${id}`,
          thumbnail: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`
        });
        if (typeof pasteDialog.close === 'function') pasteDialog.close();
      });

      // Topbar Back Button
      btnTopbarBack.addEventListener('click', () => {
        if (currentActiveView !== 'home') {
          switchView('home');
        } else {
          window.parent.postMessage({ type: 'CINESYNC_CLOSE_YOUTUBE' }, '*');
        }
      });

      // Topbar Close Button
      btnTopbarClose.addEventListener('click', () => {
        window.parent.postMessage({ type: 'CINESYNC_CLOSE_YOUTUBE' }, '*');
      });

    })();
  </script>
</body>
</html>
