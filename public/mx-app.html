<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MX Player — ZAMI Watch Party Edition</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }
    .mx-nav {
      position: sticky; top: 0; z-index: 1000; height: 64px;
      background: rgba(9, 10, 15, 0.95); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .mx-logo { display: flex; align-items: center; cursor: pointer; }
    .mx-sync-badge {
      background: rgba(0, 102, 255, 0.15); border: 1px solid rgba(0, 102, 255, 0.4);
      color: #3b82f6; font-size: 11px; font-weight: 800; padding: 4px 10px;
      border-radius: 12px; display: flex; align-items: center; gap: 6px;
    }
    .mx-hero {
      position: relative; height: 460px; background: #000; display: flex; align-items: center;
    }
    .mx-hero-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.65;
    }
    .mx-hero-grad {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, #090a0f 0%, rgba(9, 10, 15, 0.8) 40%, transparent 100%),
                  linear-gradient(0deg, #090a0f 0%, transparent 40%);
    }
    .mx-hero-content {
      position: relative; z-index: 10; max-width: 600px; padding: 0 40px;
    }
    .mx-btn-primary {
      background: linear-gradient(135deg, #0066ff 0%, #2563eb 100%);
      color: #fff; font-size: 14px; font-weight: 800; padding: 11px 22px;
      border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    .mx-btn-secondary {
      background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; font-weight: 700;
      padding: 11px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .mx-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
      padding: 24px 40px 60px 40px;
    }
    .mx-card {
      position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
      cursor: pointer; background: #141724; transition: transform 0.2s, box-shadow 0.2s;
    }
    .mx-card:hover {
      transform: scale(1.05); box-shadow: 0 10px 24px rgba(0, 102, 255, 0.25);
    }
    .mx-card-img { width: 100%; height: 100%; object-fit: cover; }
    .mx-card-body {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
    }
  </style>
</head>
<body>
  <nav class="mx-nav">
    <div class="mx-logo">
      <svg viewBox="0 0 100 46" width="80" height="34" fill="none">
        <rect x="6" y="5" width="36" height="36" rx="9" fill="#0066FF"/>
        <polygon points="20,15 32,23 20,31" fill="#FFFFFF"/>
        <text x="48" y="27" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">MX</text>
        <text x="49" y="37" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#3B82F6">PLAYER</text>
      </svg>
    </div>
    <div class="mx-sync-badge">
      <span style="width:6px;height:6px;border-radius:50%;background:#0066ff;box-shadow:0 0 6px #0066ff;"></span>
      <span>MX PLAYER INBUILT CINEMA HUB</span>
    </div>
  </nav>

  <section class="mx-hero">
    <img class="mx-hero-bg" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80">
    <div class="mx-hero-grad"></div>
    <div class="mx-hero-content">
      <div style="font-size:12px;font-weight:900;color:#3b82f6;letter-spacing:0.1em;margin-bottom:8px;">MX ORIGINAL SERIES</div>
      <h1 style="font-size:38px;font-weight:900;margin-bottom:12px;">Aashram & Bhaukaal Season 3</h1>
      <p style="color:#cbd5e1;font-size:14px;line-height:1.5;margin-bottom:20px;">
        Watch thousands of free Bollywood blockbusters, web series, and regional cinema with friends in full sync.
      </p>
      <div style="display:flex;gap:12px;">
        <button class="mx-btn-primary" id="btn-mx-screen">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span>SCREEN TO ROOM (SYNCED)</span>
        </button>
        <button class="mx-btn-secondary" id="btn-mx-vault" style="display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          <span>BROWSE 10,000+ MOVIES</span>
        </button>
      </div>
    </div>
  </section>

  <div style="padding:24px 40px 8px 40px;font-size:20px;font-weight:800;">Popular MX Releases</div>
  <div class="mx-grid" id="mx-grid"></div>

  <script>
    (function() {
      const items = [
        { title: 'Aashram Season 3', thumb: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=720&q=80', ytId: 'oqxAJKy0ii4' },
        { title: 'Bhaukaal 2', thumb: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=720&q=80', ytId: 'b9EkMc79ZSU' },
        { title: 'Campus Diaries', thumb: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=720&q=80', ytId: 'Di310BC8urj' },
        { title: 'Raktanchal Crime Thriller', thumb: 'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=720&q=80', ytId: 'p_PJbmrX4uk' }
      ];

      const grid = document.getElementById('mx-grid');
      items.forEach(item => {
        const d = document.createElement('div');
        d.className = 'mx-card';
        d.innerHTML = `
          <img class="mx-card-img" src="${item.thumb}" alt="${item.title}">
          <div class="mx-card-body">
            <div style="font-weight:700;font-size:14px;">${item.title}</div>
            <div style="font-size:11px;color:#3b82f6;margin-top:2px;">▶ Screen to Room</div>
          </div>
        `;
        d.addEventListener('click', () => {
          window.parent.postMessage({
            type: 'CINESYNC_PLAY_YOUTUBE',
            url: `https://www.youtube.com/watch?v=${item.ytId}`,
            title: `MX Player // ${item.title}`,
            poster: item.thumb
          }, '*');
        });
        grid.appendChild(d);
      });

      document.getElementById('btn-mx-screen').addEventListener('click', () => {
        window.parent.postMessage({
          type: 'CINESYNC_PLAY_YOUTUBE',
          url: `https://www.youtube.com/watch?v=oqxAJKy0ii4`,
          title: 'MX Player // Aashram Season 3',
          poster: items[0].thumb
        }, '*');
      });

      document.getElementById('btn-mx-vault').addEventListener('click', () => {
        window.parent.postMessage({ type: 'CINESYNC_OPEN_MX_VAULT' }, '*');
      });
    })();
  </script>
</body>
</html>
